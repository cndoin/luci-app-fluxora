name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Match release tag to package version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipk dist/*.apk dist/*.zip dist/SHA256SUMS dist/MD5SUMS --verify-tag --title "Fluxora $GITHUB_REF_NAME · 流光" --notes-file docs/RELEASE.md
